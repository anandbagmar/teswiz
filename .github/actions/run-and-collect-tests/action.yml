name: Run and Collect Tests

description: >
  Composite action to run test suites with specified tags, config, and environment, collect the exit code,
  and upload artifacts from the target/ directory.

inputs:
  id:
    required: true
    description: Short identifier for the test suite (used in logs and artifact naming)
  config-path:
    required: true
    description: Path to the test configuration .properties file
  tag:
    required: true
    description: Cucumber tag to execute (e.g. @smoke and @web)
  platform:
    required: true
    description: Platform under test (e.g. web, android, api)
  applitools_api_key:
    required: true
    description: Applitools API Key
  browserstack_username:
    required: true
    description: BrowserStack username
  browserstack_key:
    required: true
    description: BrowserStack access key
  display-name:
    required: true
    description: Friendly name for logs (e.g. "PDF Web Tests")
  artifact-name:
    required: true
    description: Name of the artifact to be saved
  is-visual:
    required: true
    description: Whether to enable visual testing (true or false)
  additional-env:
    required: false
    description: Additional environment variables (space-separated)

outputs:
  exit_code:
    description: Exit code from test execution
    value: ${{ steps.run-tests.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - id: run-tests
      shell: bash
      run: |
        set +e
        echo "🧪 Running ${{ inputs.display-name }}"
        export TESWIZ_APPLITOOLS_API_KEY="${{ inputs.applitools_api_key }}"
        export CLOUD_USERNAME="${{ inputs.browserstack_username }}"
        export CLOUD_KEY="${{ inputs.browserstack_key }}"
        export IS_VISUAL="${{ inputs.is-visual }}"
        export PLATFORM="${{ inputs.platform }}"
        export CONFIG="${{ inputs.config-path }}"
        export TAG="${{ inputs.tag }}"
        export RUN_IN_CI=true

        if [[ -n "${{ inputs.additional-env }}" ]]; then
          echo "Setting additional environment: ${{ inputs.additional-env }}"
          eval "export ${{ inputs.additional-env }}"
        fi

        echo "============================================================"
        echo "🧪 Test Execution Details: ${{ inputs.display-name }}"
        echo "============================================================"
        echo "🚀 Command Line: ./gradlew run"
        echo "📊 Active Overridden Configuration & Environment Variables:"
        echo "   - CONFIG:                       ${CONFIG:-<not set>}"
        echo "   - TAG:                          ${TAG:-<not set>}"
        echo "   - PLATFORM:                     ${PLATFORM:-<not set>}"
        echo "   - API_ENGINE:                   ${API_ENGINE:-<not set (default: rest-assured)>}"
        echo "   - WEB_ENGINE:                   ${WEB_ENGINE:-<not set (default: selenium)>}"
        echo "   - FRAMEWORK:                    ${FRAMEWORK:-<not set (default: cucumber)>}"
        echo "   - HEADLESS:                     ${HEADLESS:-<not set>}"
        echo "   - IS_VISUAL:                    ${IS_VISUAL:-<not set>}"
        echo "   - RUN_IN_CI:                    ${RUN_IN_CI:-<not set>}"
        if [[ -n "${SET_HARD_GATE}" ]]; then
          echo "   - SET_HARD_GATE:                ${SET_HARD_GATE}"
        fi
        if [[ -n "${IS_FAILING_TEST_SUITE}" ]]; then
          echo "   - IS_FAILING_TEST_SUITE:        ${IS_FAILING_TEST_SUITE}"
        fi
        if [[ -n "${APPLITOOLS_BATCH_NAME_SUFFIX}" ]]; then
          echo "   - APPLITOOLS_BATCH_NAME_SUFFIX: ${APPLITOOLS_BATCH_NAME_SUFFIX}"
        fi
        echo "============================================================"

        EXIT_CODE=0
        ./gradlew run || EXIT_CODE=$?
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

    - name: Upload ${{ inputs.display-name }} Results
      if: ${{ always() && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' && !startsWith(github.head_ref || github.ref_name, 'dependabot/') && !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: target
        retention-days: 4
