name: API_Engines_CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api_engine_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "RestAssured API Engine"
            api_engine: "rest-assured"
            web_engine: "selenium"
            tag: "@api"
          - name: "Playwright Java API Engine"
            api_engine: "playwright-java"
            web_engine: "selenium"
            tag: "@api"
          - name: "Playwright TypeScript Engine Suite"
            api_engine: "playwright-java"
            web_engine: "playwright-ts"
            tag: "@api and @playwright-ts"

    name: ${{ matrix.name }}

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install chromium

      - name: 🧪 Execute API Engine Test Suite
        env:
          CONFIG: "./configs/api_local_config.properties"
          TAG: "${{ matrix.tag }}"
          API_ENGINE: "${{ matrix.api_engine }}"
          WEB_ENGINE: "${{ matrix.web_engine }}"
        run: |
          echo "============================================================"
          echo "🧪 Test Execution Details: ${{ matrix.name }}"
          echo "============================================================"
          echo "🚀 Command Line: ./gradlew run"
          echo "📊 Active Overridden Configuration & Environment Variables:"
          echo "   - CONFIG:     ${CONFIG}"
          echo "   - TAG:        ${TAG}"
          echo "   - API_ENGINE: ${API_ENGINE}"
          echo "   - WEB_ENGINE: ${WEB_ENGINE}"
          echo "============================================================"
          ./gradlew run

      - name: 📦 Upload API Traffic & Execution Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-execution-reports-${{ matrix.api_engine }}-${{ matrix.web_engine }}
          path: target
          retention-days: 4
