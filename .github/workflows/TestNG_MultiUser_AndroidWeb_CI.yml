name: TestNG_MultiUser_AndroidWeb_CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Appium dependencies
        run: |
          node -v
          npm ci
          npm list

      - name: Run TestNG-mode Multi-User Android-Web test
        id: testng_multi_user_android_web
        uses: ./.github/actions/run-and-collect-tests
        with:
          id: testng-multi-user-android-web
          display-name: "TestNG Multi-User Android-Web"
          config-path: "./configs/theapp/theapp_browserstack_android_config.properties"
          platform: "android"
          tag: "@multiuser-android-web"
          artifact-name: "test-results-testng-multi-user-android-web"
          is-visual: "false"
          additional-env: "FRAMEWORK=testng"
          applitools_api_key: ${{ secrets.TESWIZ_APPLITOOLS_API_KEY }}
          browserstack_username: ${{ secrets.BROWSERSTACK_CLOUD_USERNAME }}
          browserstack_key: ${{ secrets.BROWSERSTACK_CLOUD_KEY }}

      - name: Check for Failures and Add Summary
        run: |
          echo "Checking exit code for TestNG-mode Android-Web multi-user test run..."
          TESTNG_MULTI_USER_ANDROID_WEB_CODE="${{ steps.testng_multi_user_android_web.outputs.exit_code }}"

          if [ "$TESTNG_MULTI_USER_ANDROID_WEB_CODE" != "0" ]; then
            {
              echo "### ❌ TestNG Multi-User Android-Web CI Test Failure"
              echo "- TestNG Multi-User Android-Web (exit code: $TESTNG_MULTI_USER_ANDROID_WEB_CODE)"
              echo
              echo "**Commit:** ${{ github.sha }}"
              echo "**Triggered by:** ${{ github.actor }}"
              echo "**Workflow:** [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ TestNG-mode Android-Web multi-user test passed"

      - name: Keep latest TestNG multi-user Android-Web artifacts for this branch
        if: always()
        uses: ./.github/actions/cleanup-branch-artifacts
        with:
          workflow-file: TestNG_MultiUser_AndroidWeb_CI.yml
          branch-name: ${{ github.head_ref || github.ref_name }}
          current-run-id: ${{ github.run_id }}
