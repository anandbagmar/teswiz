# ArchUnit configuration for com.znsio.teswiz.architecture tests.
#
# Frozen rules record their current violations in the store below (committed to git). A later
# run fails only on NEW violations; fixed violations are removed from the store automatically.
# The default line matcher ignores line numbers, so unrelated edits do not create false failures.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false
