# End-of-run notifications for the teswiz sample tests.
# Shared by every sample run; intentionally DISABLED so the samples never try to
# deliver anything. teswiz loads this from the classpath at the end of a run; with
# notifications off and no composer configured, it is a complete no-op.
#
# To try notifications in a sample run, flip notify.enabled=true, point
# notify.composer.class at a RunNotificationComposer implementation, and supply the
# destinations/secrets via environment variables (NOTIFY_* overrides win over this
# file; SMTP_PASSWORD and the Slack webhook URL come from the environment only).
# See configs/teswiz/notifications.properties.template and
# docs/subsystems/run-notifications.md for the full key reference.

# Master switch - OFF for the samples.
notify.enabled=false

# Best-effort by default: a notification problem never fails a sample run.
notify.fail.on.error=false

# No composer configured - nothing is composed or delivered.
notify.composer.class=

# Branches allowed to notify (used only when notify.enabled=true).
notify.branches=master,main

# Channels - OFF for the samples. Enabling a channel without a destination does
# nothing by default (and only fails the run when notify.fail.on.error=true).
notify.slack.enabled=false
notify.email.enabled=false

# SMTP connection facts (blank for the samples; the password is read from the
# SMTP_PASSWORD environment variable, never from this file).
notify.smtp.host=
notify.smtp.port=
notify.smtp.tls=
notify.smtp.auth=
notify.smtp.from=
notify.smtp.username=
